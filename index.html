<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TechFix — Assistência Técnica</title>
<meta name="description" content="Abertura rápida de OS: CPU, Notebook, Impressora e Outros." />
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="bg-orbs"><span class="orb o1"></span><span class="orb o2"></span><div class="grid-overlay"></div></div>

<header class="topbar glass simple-top">
  <div class="brand">
    <div class="logo"><i class="fa-solid fa-microchip"></i></div>
    <div><strong>TechFix</strong><small>Assistência Técnica</small></div>
  </div>
  <button id="themeBtn" class="icon-btn" title="Tema"><i class="fa-solid fa-circle-half-stroke"></i></button>
</header>

<main class="simple-wrap">
  <div class="simple-hero">
    <h1>Nova ordem de serviço</h1>
    <p>Preencha, imprima ou chame no WhatsApp. Sem cadastro, sem histórico.</p>
  </div>

  <form id="osForm" class="glass simple-card">
    <p class="side-title">1 • CLASSE DO EQUIPAMENTO</p>
    <div class="class-pick" id="classPick">
      <button type="button" data-class="CPU" class="active"><i class="fa-solid fa-tower-observation"></i>CPU</button>
      <button type="button" data-class="Notebook"><i class="fa-solid fa-laptop"></i>Notebook</button>
      <button type="button" data-class="Impressora"><i class="fa-solid fa-print"></i>Impressora</button>
      <button type="button" data-class="Outros"><i class="fa-solid fa-tablet-screen-button"></i>Outros</button>
    </div>

    <p class="side-title">2 • DADOS</p>
    <div class="grid2">
      <label>Cliente*<input name="cliente" required placeholder="Ex: Maria Silva" /></label>
      <label>Telefone / WhatsApp*<input name="telefone" required placeholder="(00) 90000-0000" /></label>
    </div>
    <div class="grid2">
      <label>Marca / Modelo<input name="modelo" placeholder="Ex: Dell Inspiron / Epson L3250" /></label>
      <label>Valor (R$)<input name="valor" type="number" min="0" step="0.01" placeholder="0.00" /></label>
    </div>
    <label>Defeito relatado*<textarea name="defeito" required rows="3" placeholder="Ex: Não liga..."></textarea></label>
    <div class="grid2">
      <label>Previsão entrega<input name="previsao" type="date" /></label>
      <label>Obs<input name="obs" placeholder="Senha, acessórios..." /></label>
    </div>

    <div class="simple-actions">
      <button type="button" id="printBtn" class="btn-primary"><i class="fa-solid fa-print"></i> Imprimir OS</button>
      <button type="button" id="wppBtn" class="btn-wpp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
      <button type="reset" class="btn-glass">Limpar</button>
    </div>
  </form>

  <footer class="foot">TechFix • página única • GitHub Pages</footer>
</main>

<script src="js/app.js"></script>
</body>
</html>
